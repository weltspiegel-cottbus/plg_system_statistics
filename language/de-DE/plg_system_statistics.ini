PLG_SYSTEM_STATISTICS="System - Weltspiegel Statistik"
PLG_SYSTEM_STATISTICS_FIELD_METRICS_LABEL="Gemessene Merkmale"
PLG_SYSTEM_STATISTICS_FIELD_METRICS_DESC="Jedes aktivierte Merkmal erzeugt pro Seitenaufruf eine zusätzliche, sehr kleine Anfrage. Für die Beurteilung des Layouts genügen in der Regel Viewport-Breite und Eingabegerät."
PLG_SYSTEM_STATISTICS_FIELD_EXCLUDE_LABEL="Angemeldete Benutzer ausschließen"
PLG_SYSTEM_STATISTICS_FIELD_EXCLUDE_DESC="Aufrufe angemeldeter Redakteure werden nicht mitgezählt, damit eigene Kontrollbesuche das Bild der echten Besucher nicht verzerren."
PLG_SYSTEM_STATISTICS_FIELD_PAGEVIEWS_LABEL="Seitenaufrufe zählen"
PLG_SYSTEM_STATISTICS_FIELD_PAGEVIEWS_DESC="Zählt, welche Art von Seite aufgerufen wird und woher der Besucher kommt (direkt, von der eigenen Seite, Suchmaschine, soziale Netze, andere). Gespeichert werden nur Tageszähler — keine Adressen, keine Kennung, kein Cookie, kein Skript. Gezählt werden nur Aufrufe, die sich als Browser-Navigation ausweisen; Suchmaschinen-Roboter bleiben außen vor."
