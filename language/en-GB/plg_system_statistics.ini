PLG_SYSTEM_STATISTICS="System - Weltspiegel Statistics"
PLG_SYSTEM_STATISTICS_FIELD_METRICS_LABEL="Measured characteristics"
PLG_SYSTEM_STATISTICS_FIELD_METRICS_DESC="Every enabled characteristic adds one very small request per page view. Viewport width and pointer type are usually enough to judge the layout."
PLG_SYSTEM_STATISTICS_FIELD_EXCLUDE_LABEL="Exclude logged in users"
PLG_SYSTEM_STATISTICS_FIELD_EXCLUDE_DESC="Page views of logged in editors are not counted, so that reviewing your own changes does not distort the picture of real visitors."
PLG_SYSTEM_STATISTICS_FIELD_PAGEVIEWS_LABEL="Count page views"
PLG_SYSTEM_STATISTICS_FIELD_PAGEVIEWS_DESC="Counts which kind of page is viewed and where the visitor came from (direct, own site, search engine, social network, other). Only daily counters are stored - no addresses, no identifier, no cookie, no script. Only requests that identify as a browser navigation are counted, so crawlers stay out."
